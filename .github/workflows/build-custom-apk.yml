name: WishCode V0.5 Preview 007 LexicalInput NoGLM Android APK - Manual
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wishcode-preview-manual
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout independent WishCode build scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test WishCode patch logic (does not compile APK)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 -m py_compile scripts/customize.py scripts/release_config.py scripts/pin_linux_aapt2.py scripts/prepare_purge_flash.py scripts/prepare_dnf_dev.py scripts/register_wishcode_assets.py scripts/patch_lexical_input.py

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test mobile model menu and retired preview regression (no network)
        run: |
          set -euo pipefail
          node --check scripts/wishcode-mobile.js
          node --check scripts/test_contextual_preview.cjs
          node scripts/test_contextual_preview.cjs

      - name: Locate Android SDK from runner installation
        shell: bash
        run: |
          set -euo pipefail
          # Proven by the first Actions run's sdkmanager log.
          SDK_ROOT="/usr/local/lib/android/sdk"
          test -d "$SDK_ROOT/cmdline-tools" || {
            echo "STOP: expected runner Android SDK directory not found"; exit 1;
          }
          SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER" || {
            echo "STOP: SDK command line tools unavailable"; exit 1;
          }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "${SDKMANAGER%/sdkmanager}" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Download pinned full DSHA source and offline runtime archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.2.1-rc.2 --repo DSH-APP/DSHA \
            --pattern 'DSHA-0.2.1-rc.2-20261022.2100-source.zip' \
            --dir .

      - name: Verify SHA-256 and extract source safely
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, stat, zipfile
          archive = Path('DSHA-0.2.1-rc.2-20261022.2100-source.zip')
          expected = 'ef134fe8713bfa4d6cf3bdea883be1591246d4b78ace16bd924f6d739188425a'
          with archive.open('rb') as handle:
              actual = hashlib.file_digest(handle, 'sha256').hexdigest()
          if actual != expected:
              raise SystemExit('STOP: upstream source ZIP SHA-256 mismatch: ' + actual)
          out = Path('upstream-source')
          out.mkdir()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in info.filename or ':' in info.filename:
                      raise SystemExit('STOP: unsafe archive path')
                  if stat.S_IFMT(info.external_attr >> 16) == stat.S_IFLNK:
                      raise SystemExit('STOP: source ZIP contains symlinks')
              z.extractall(out)
          matches = [p.parent.parent.resolve() for p in out.rglob('app/build.gradle') if p.is_file()]
          if len(matches) != 1:
              raise SystemExit('STOP: source archive has unexpected Android project layout')
          src = matches[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('source=' + str(src) + '\n')
          print('Pinned source extracted:', src)
          PY

      - name: Apply WishCode V0.5 Preview 007 mobile adaptation
        env:
          SOURCE: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          python3 scripts/customize.py "$SOURCE" \
            --template scripts/WishCodeHomeActivity.java \
            --report "$SOURCE/wishcode-patch-report.json"

      - name: Patch the authorized focused Lexical composer input
        env:
          SOURCE: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          python3 scripts/patch_lexical_input.py "$SOURCE" \
            --report "$SOURCE/wishcode-lexical-input-report.json"
          test -s "$SOURCE/wishcode-lexical-input-report.json"
          grep -Fq 'LEXICAL_INPUT_VERIFIED' \
            "$SOURCE/app/src/main/java/com/deepseekharness/app/ui/WebPreviewActivity.java"
          grep -Fq "shell.actions.insertText(value, span)" \
            "$SOURCE/app/src/main/assets/app-integration/client.js"

      - name: Build pinned opt-in Flash skill compatibility archive
        env:
          SOURCE: ${{ steps.source.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          # Fixed plugin git commit; all critical blob SHA-1 values checked.
          commit="636059f8002b060fb4dca1c1b47c02e1ef2a2f31"
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            "https://api.github.com/repos/jadezane6634-ops/dsh-purge-flash/tarball/$commit" \
            -o "$RUNNER_TEMP/dsh-purge-flash-upstream.tar.gz"
          archive="$SOURCE/app/src/main/assets/wishcode/dsh-purge-flash-v1.4.0-compat.tgz"
          python3 scripts/prepare_purge_flash.py \
            "$RUNNER_TEMP/dsh-purge-flash-upstream.tar.gz" "$archive" \
            --report "$SOURCE/armor-compat-report.json"
          mkdir -p "$RUNNER_TEMP/armor-validation"
          tar -xzf "$archive" -C "$RUNNER_TEMP/armor-validation"
          node --check "$RUNNER_TEMP/armor-validation/package/lib/skills.js"
          node --check "$RUNNER_TEMP/armor-validation/package/lib/index.js"
          grep -Fq 'export const inject = ["systemPrompt", "skills"];' \
            "$RUNNER_TEMP/armor-validation/package/lib/index.js"
          # Load the actual pinned module with a strict minimal host skill contract.
          # Do not run untrusted third-party npm lifecycle scripts or make API calls.
          (
            cd "$RUNNER_TEMP/armor-validation/package"
            node --input-type=module <<'JS'
          import { installSkills } from "./lib/skills.js";
          const state = { layers: {}, disposers: [] };
          let calls = 0;
          const ctx = { get(name) {
            return name === "skills" ? { register(skill) {
              calls++;
              if (skill.name !== "armor-playbook" || skill.source !== "runtime" ||
                  typeof skill.content !== "string" || !skill.content.trim()) {
                throw new Error("invalid runtime skill registration");
              }
              return () => {};
            }} : undefined;
          }};
          if (!installSkills(ctx, { playbook: true }, state) ||
              state.layers.skills !== "on" || calls !== 1) {
            throw new Error("armor-playbook compatibility smoke failed");
          }
          console.log("PASS armor-playbook runtime skill source:string");
          JS
          )
          test -s "$SOURCE/armor-compat-report.json"

      - name: Package and smoke-test opt-in DNF development skills
        env:
          SOURCE: ${{ steps.source.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$SOURCE/app/src/main/assets/wishcode/dsh-wishcode-dnf-dev-0.1.0.tgz"
          python3 scripts/prepare_dnf_dev.py "$archive" | tee "$SOURCE/dnf-dev-report.json"
          mkdir -p "$RUNNER_TEMP/dnf-plugin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/dnf-plugin"
          node --check "$RUNNER_TEMP/dnf-plugin/package/lib/index.js"
          (
            cd "$RUNNER_TEMP/dnf-plugin/package"
            node --input-type=module <<'JS'
          import { apply } from "./lib/index.js";
          const skills = [];
          const ctx = {
            get(name) {
              if (name !== "skills") throw new Error("unexpected service: " + name);
              return { register(skill) {
                if (skill.source !== "runtime" || typeof skill.content !== "string" ||
                    skill.content.length < 100 || skill.invocation?.modelInvocable !== true) {
                  throw new Error("invalid skill runtime contract");
                }
                skills.push(skill.name);
                return () => {};
              }};
            },
            effect(handler) { if (typeof handler() !== "function") throw new Error("invalid disposer"); }
          };
          apply(ctx, { enabled: true });
          if (skills.join(",") !==
              "wishcode-dnf-combat,wishcode-dnf-art,wishcode-dnf-release") {
            throw new Error("missing professional development skills");
          }
          console.log("PASS all 3 original DNF development skills register");
          JS
          )
          test -s "$SOURCE/dnf-dev-report.json"

      - name: Register two plugin archives in DSHA's strict asset manifest
        env:
          SOURCE: ${{ steps.source.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/register_wishcode_assets.py "$SOURCE" \
            --armor-report "$SOURCE/armor-compat-report.json" \
            --dnf-report "$SOURCE/dnf-dev-report.json" \
            --output "$SOURCE/wishcode-asset-registration.json"
          # Run the original DSHA guard before Gradle rather than bypassing it.
          (
            cd "$SOURCE"
            python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tools").resolve()))
          from asset_deployment import load_manifest, verify_reader_contracts
          count = verify_reader_contracts(Path("app/src/main/assets"),
                                          load_manifest(), repository=Path("."))
          assert count > 0, "empty approved asset deployment"
          print("PASS DSHA original asset reader/allowlist contract:", count)
          PY
          )
          test -s "$SOURCE/wishcode-asset-registration.json"

      - name: Resolve tool versions from exact upstream source
        id: toolchain
        env:
          SOURCE: ${{ steps.source.outputs.source }}
        run: |
          cd "$SOURCE"
          python3 tools/ci-toolchain.py --github-output

      - name: Install matching Android SDK, Build Tools and NDK
        run: |
          set -euo pipefail
          # Hosted runners may have unaccepted SDK package licenses.
          # Use a finite response file, not yes | sdkmanager (SIGPIPE under pipefail).
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/sdk-license-answers"
          if ! sdkmanager --licenses < "$RUNNER_TEMP/sdk-license-answers" > "$RUNNER_TEMP/sdk-licenses.log" 2>&1; then
            tail -n 25 "$RUNNER_TEMP/sdk-licenses.log"
            exit 1
          fi
          sdkmanager "platforms;${{ steps.toolchain.outputs.androidPlatform }}" \
                     "build-tools;${{ steps.toolchain.outputs.buildTools }}" \
                     "ndk;${{ steps.toolchain.outputs.ndk }}"

      - name: Recompute and verify upstream managed runtime descriptor
        env:
          SOURCE: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          cd "$SOURCE"
          python3 tools/prepare-backup-assets.py --check
          python3 tools/prepare-runtime-descriptor.py --write
          python3 tools/prepare-runtime-descriptor.py --check

      - name: Pin reviewed Google Maven Linux AAPT2 artifact
        env:
          SOURCE: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          python3 scripts/pin_linux_aapt2.py "$SOURCE"

      - name: Compile real Standard Debug APK (no original signing key)
        env:
          SOURCE: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          cd "$SOURCE"
          chmod +x gradlew
          bash build.sh :app:assembleStandardDebug

      - name: Verify APK signature and independent Android package ID
        env:
          SOURCE: ${{ steps.source.outputs.source }}
          BUILD_TOOLS: ${{ steps.toolchain.outputs.buildTools }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE"
          test -n "$BUILD_TOOLS"
          mkdir -p dist
          count=$(find "$SOURCE/app/build/outputs/apk" \
             -path '*/standard/debug/*' -name '*.apk' -type f | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "STOP: expected exactly one compiled Standard Debug APK"; exit 1
          fi
          apk=$(find "$SOURCE/app/build/outputs/apk" \
             -path '*/standard/debug/*' -name '*.apk' -type f | head -1)
          cp "$apk" dist/WishCode-v0.5-preview-007-lexicalinput-no-glm-arm64-debug.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify \
             --verbose --print-certs dist/WishCode-v0.5-preview-007-lexicalinput-no-glm-arm64-debug.apk | tee dist/signature-report.txt
          badging=$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging \
             dist/WishCode-v0.5-preview-007-lexicalinput-no-glm-arm64-debug.apk)
          package=$(printf '%s\n' "$badging" | sed -n \
             "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          version_code=$(printf '%s\n' "$badging" | sed -n \
             "s/^package: .*versionCode='\([^']*\)'.*/\1/p" | head -1)
          version_name=$(printf '%s\n' "$badging" | sed -n \
             "s/^package: .*versionName='\([^']*\)'.*/\1/p" | head -1)
          test "$package" = "app.wishcode.harnessmobile.v05trial7"
          test "$version_code" = "197"
          test "$version_name" = "0.5-preview-007-lexicalinput-dsh0.2.1-rc.2"
          printf 'Verified package=%s versionCode=%s versionName=%s\n' \
             "$package" "$version_code" "$version_name" | tee dist/package-version-report.txt
          unzip -t dist/WishCode-v0.5-preview-007-lexicalinput-no-glm-arm64-debug.apk >/dev/null
          sha256sum dist/WishCode-v0.5-preview-007-lexicalinput-no-glm-arm64-debug.apk > dist/SHA256SUMS.txt
          cp "$SOURCE/wishcode-patch-report.json" dist/patch-report.json
          cp "$SOURCE/wishcode-lexical-input-report.json" dist/lexical-input-report.json
          cp "$SOURCE/armor-compat-report.json" dist/armor-compat-report.json
          cp "$SOURCE/dnf-dev-report.json" dist/dnf-dev-report.json
          cp "$SOURCE/wishcode-asset-registration.json" dist/asset-registration-report.json
          cp "$SOURCE/app/src/main/assets/wishcode/dsh-wishcode-dnf-dev-0.1.0.tgz" \
            dist/dsh-wishcode-dnf-dev-0.1.0.tgz
          sha256sum dist/dsh-wishcode-dnf-dev-0.1.0.tgz \
            > dist/DNF-DEV-SHA256.txt
          cp "$SOURCE/app/src/main/assets/wishcode/dsh-purge-flash-v1.4.0-compat.tgz" \
            dist/dsh-purge-flash-v1.4.0-wishcode-compat.tgz
          sha256sum dist/dsh-purge-flash-v1.4.0-wishcode-compat.tgz \
            > dist/ARMOR-COMPAT-SHA256.txt
          git rev-parse HEAD > dist/source-commit.txt

      - name: Upload verified, signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: WishCode-V0.5-Preview-007-LexicalInput-Android-APK
          path: dist/
          if-no-files-found: error
          retention-days: 7
